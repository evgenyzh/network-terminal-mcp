[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "network-terminal-mcp"
version = "0.1.0"
description = "Session-oriented MCP server for interactive network device terminals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.1.1,<3",
  "netmiko>=4.7,<5",
  "pydantic>=2.12",
  "pydantic-settings>=2.10",
  "pyyaml>=6.0",
]

[project.scripts]
network-terminal-mcp = "network_terminal_mcp.server:main"

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "pytest-cov>=7.0",
  "ruff>=0.13",
  "types-paramiko>=5.0.0.20260724",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/network_terminal_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["network_terminal_mcp"]
