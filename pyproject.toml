[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "network-terminal-mcp"
version = "0.2.0"
description = "Persistent local terminals for MCP clients, opened with real SSH, Telnet, and serial commands"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evgeny Zhuravlev" }]
keywords = ["mcp", "network", "ssh", "telnet", "serial", "terminal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "mcp>=2.1.1,<3",
  "pydantic>=2.12",
  "pyserial>=3.5",
  "ptyprocess>=0.7,<1",
]

[project.scripts]
network-terminal-mcp = "network_terminal_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/evgenyzh/network-terminal-mcp"
Repository = "https://github.com/evgenyzh/network-terminal-mcp"
Issues = "https://github.com/evgenyzh/network-terminal-mcp/issues"
Changelog = "https://github.com/evgenyzh/network-terminal-mcp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "pytest-cov>=7.0",
  "ruff>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/network_terminal_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["network_terminal_mcp"]

[[tool.mypy.overrides]]
module = ["serial", "serial.*", "ptyprocess", "ptyprocess.*"]
ignore_missing_imports = true
