---
devices:
  lab-cisco:
    host: 192.0.2.10
    platform: cisco_ios
    credentials: network-tacacs
    connection: direct
    tags: [lab, cisco]

  lab-snr-29xx:
    host: 192.0.2.20
    platform: snr_29xx
    credentials: network-tacacs
    connection: through-terminal
    tags: [lab, snr, access]

  # Telnet is only reachable with an explicit opt-in on the device in addition
  # to a policy that allows Telnet.
  lab-cisco-telnet:
    host: 192.0.2.30
    platform: cisco_ios
    credentials: network-tacacs
    connection: direct-telnet
    allow_telnet: true
    tags: [lab, cisco, telnet]

groups:
  lab:
    tags: [lab]
