---
# Inventory is infrastructure-only: bastion/jump hosts, and defaults for ad-hoc
# device access. Network devices themselves are reached ad-hoc by the model via
# open_session(host=..., platform=...), where credentials and connection fall
# back to the defaults below.
#
# For a fleet of thousands of switches there is no per-switch record here. The
# model decides how to connect each time, specifying the platform (or guessing
# it and correcting with set_platform after reading the output).
default_credentials: network-tacacs
default_connection: through-jump

devices:
  # Optional: keep named infrastructure targets (jump hosts, console servers)
  # or a handful of lab devices for debugging. Most devices are ad-hoc.
  lab-cisco:
    host: 192.0.2.10
    platform: cisco_ios
    credentials: network-tacacs
    connection: through-jump
    tags: [lab, cisco]

groups:
  lab:
    tags: [lab]
