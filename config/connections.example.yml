---
connections:
  direct:
    type: direct
    protocol: ssh
    host_key_policy: strict

  # Weak trust, opt-in per profile, for platforms that rotate host keys on
  # every boot (e.g. some SNR). Do not use for devices with stable keys.
  direct-snr:
    type: direct
    protocol: ssh
    host_key_policy: accept_changed

  through-jump:
    type: proxyjump
    protocol: ssh
    jump_host: jump.example.net
    jump_port: 22
    jump_credentials: terminal-tacacs
    jump_host_key_policy: strict
    host_key_policy: strict

  through-terminal:
    type: nested
    host: terminal.example.net
    protocol: ssh
    credentials: terminal-tacacs
    next_protocol: ssh
    host_key_policy: strict

  legacy-direct:
    type: direct
    protocol: legacy_ssh
    host_key_algorithms: [ssh-rsa]
    kex_algorithms: [diffie-hellman-group14-sha1]
    ciphers: [aes128-cbc]

  # Cleartext-only. Requires allow_telnet: true on the device and a policy that
  # allows Telnet. host_key checking does not apply.
  direct-telnet:
    type: direct
    protocol: telnet
    host_key_policy: strict
    port: 23

  # TCP console port of a terminal server; requires allow_telnet and policy
  # allow. connect_command is deliberately unsupported.
  console:
    type: console
    port: 2002

platforms:
  snr_29xx:
    driver: cisco_ios
    dialect: snr_29xx

  snr_52xx:
    driver: cisco_ios
    dialect: snr_52xx

  dlink_ds:
    driver: dlink_ds
    dialect: dlink_ds
    cli_help_requires_enter: true
    # Optional Telnet driver override; defaults to <driver>_telnet.
    telnet_driver: dlink_ds_telnet
