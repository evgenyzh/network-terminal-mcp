---
credentials:
  network-tacacs:
    backend: pass
    entry: network/credentials/network-tacacs
    username: operator

  terminal-tacacs:
    backend: pass
    entry: network/credentials/terminal-server
    username: operator

  jump-key:
    backend: ssh_key
    key_file: ~/.ssh/id_ed25519
    key_passphrase_entry: network/credentials/jump-key-passphrase
    username: operator
